apply plugin: 'com.android.application'

// Release signing: android/keystore.properties (never in git) with storeFile, storePassword, keyAlias and keyPassword.
// Without it, release builds come out unsigned. Version: from package.json (0.5.0 -> versionCode 500).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def (vMajor, vMinor, vPatch) = pkg.version.tokenize('.').collect { it as int }

android {
    namespace = "com.nocodeboy.wildputt"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nocodeboy.wildputt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
// Release guard (ported from ¡Apágalo!): a release build (bundleRelease, assembleRelease) must not ship
// Google's test ads. It fails if the manifest still has Google's test AdMob app id, or if the synced game was built
// with USE_TEST_ADS: true (dist/android/ads-check.json, written by build.mjs and copied by `cap sync`).
// Only for a test build that keeps the test ads on purpose: ./gradlew bundleRelease -PallowTestAds
def adsManifest = file('src/main/AndroidManifest.xml')
def adsCheckFile = file('src/main/assets/public/ads-check.json')
def allowTestAds = project.hasProperty('allowTestAds')
def checkReleaseAds = tasks.register('checkReleaseAds') {
    doLast {
        def testAppId = 'ca-app-pub-3940256099942544~3347511713'
        def problems = []
        if (adsManifest.text.contains(testAppId)) {
            problems << "AndroidManifest.xml still has Google's test AdMob app id (${testAppId})"
        }
        if (!adsCheckFile.exists()) {
            problems << "no ads-check.json in the synced game: run `npm run android:sync` (RELEASE=1 node build.mjs && npx cap sync android)"
        } else if (new groovy.json.JsonSlurper().parse(adsCheckFile).testAds) {
            problems << "the synced game was built with USE_TEST_ADS: true (src/monetize/android.ts)"
        }
        if (problems) {
            def msg = "Release with test ads: " + problems.join('; ')
            if (allowTestAds) {
                logger.warn("WARNING (-PallowTestAds): ${msg}")
            } else {
                throw new GradleException(msg + ". See src/monetize/android.ts (ADMOB_CONFIG), or pass -PallowTestAds for a test build.")
            }
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn checkReleaseAds }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
